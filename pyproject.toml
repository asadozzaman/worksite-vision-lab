[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "worksite-vision-lab"
version = "0.1.0"
description = "Evidence-driven construction video intelligence research"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "AGPL-3.0-only"
dependencies = ["pydantic==2.13.4"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.14.14"]
vision = [
    "ultralytics==8.4.173",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "lap==0.5.12",
]

[project.scripts]
worksite = "vision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
