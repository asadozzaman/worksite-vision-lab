name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  person-evaluation:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements/evaluation.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest tests/test_evaluation_inputs.py tests/test_evaluation_metrics.py tests/test_evaluation_run.py tests/test_reference.py
  annotation-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/annotation_core.test.cjs
      - run: node --test tests/site_payload.test.cjs
      - run: node --check vision/evaluation/annotation-ui.js
      - run: node --check site/app.js
  foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements/foundation.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: worksite validate-assets docs/assets.json
      - run: worksite validate-config experiments/configs/baseline-cpu.json
  tracker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[vision,dev]'
      - run: python -m pytest tests/test_tracking_integration.py tests/test_tracking_records.py
        env:
          YOLO_AUTOINSTALL: 'false'
